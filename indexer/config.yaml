# Envio HyperIndex for Pact on Monad.
# Fill FACTORY_ADDRESS + START_BLOCK after testnet deploy, then:
#   pnpm dlx @envio-dev/hyperindex-cli init  (or deploy this dir via Envio Cloud)
name: pact
description: Conditional group pots — created, committed, tilted, refunded.
networks:
  - id: 10143 # Monad testnet
    start_block: 63830698
    contracts:
      - name: PactFactory
        address:
          - "0xFD842da1854e40c55F19FE63a879CB65cd3B9A28"
  - id: 143 # Monad mainnet
    start_block: 106125317
    contracts:
      - name: PactFactory
        address:
          - "0xDFEcE74f0aDBa3cc18B065DBA0DEc82bE52AA830"
        events:
          - event: PotCreated(address indexed pot, address indexed organizer, address indexed payee, address token, uint256 perPerson, uint256 partySize, uint256 deadline, string title, bool isPrivate)
      - name: PactPot
        # Pots are EIP-1167 clones; register dynamically from PotCreated.
        # If Envio dynamic-contract registration is unavailable, add pot
        # addresses here after creation (demo scale: a handful of pots).
        address: []
        events:
          - event: Committed(address indexed pot, address indexed user, uint256 index)
          - event: Tilted(address indexed pot, uint256 total)
          - event: RefundingOpened(address indexed pot)
          - event: Refunded(address indexed pot, address indexed user, uint256 amount)
